<style>
  :root {
    --canvas-bg: #050709;
    --card-bg-start: #141B26;
    --card-bg-end: #0A0E15;
    --brass: #D8B26A;
    --brass-glow: rgba(216, 178, 106, 0.28);
    --brass-border: rgba(216, 178, 106, 0.36);
    --brass-shine: rgba(255, 235, 190, 0.16);
    --steel: #4C6A8A;
    --mist: #EDF2F7;
    --mist-dim: #94A3B8;
    --inner-line: rgba(237, 242, 247, 0.08);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    background: var(--canvas-bg);
    color: var(--mist);
    font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
    min-height: 100%;
  }

  body {
    background: var(--canvas-bg);
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
  }

  /* Luce d'atmosfera dietro la card */
  body::before {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    max-width: 95vw;
    height: 600px;
    max-height: 90vh;
    background: radial-gradient(circle, rgba(216, 178, 106, 0.12) 0%, rgba(76, 106, 138, 0.06) 45%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Micro-pattern tecnologico */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(216, 178, 106, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(216, 178, 106, 0.02) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
    z-index: 0;
  }

  /* ══ LA SMART CARD PRINCIPALE ══ */
  .smart-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    border-radius: 30px;
    background: linear-gradient(168deg, var(--card-bg-start) 0%, var(--card-bg-end) 100%);
    border: 1px solid var(--brass-border);
    box-shadow: 
      0 26px 70px -15px rgba(0, 0, 0, 0.88),
      0 0 0 1px rgba(0, 0, 0, 0.6),
      0 0 35px -5px rgba(216, 178, 106, 0.12),
      inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
    padding: 24px 22px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    overflow: hidden;
  }

  /* Effetto riflesso di luce metallica sulla superficie della card */
  .smart-card::before {
    content: "";
    position: absolute;
    top: -40%;
    left: -20%;
    width: 140%;
    height: 70%;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
    transform: rotate(-12deg);
    pointer-events: none;
  }

  /* ══ TOP BAR DELLA CARD: NFC & BRAND ══ */
  .card-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--inner-line);
  }

  .card-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 600;
  }

  .chip-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 8px var(--brass);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }

  .card-nfc {
    display: flex;
    align-items: center;
    color: var(--mist-dim);
    transition: color 0.2s ease;
  }
  .card-nfc svg {
    width: 18px;
    height: 18px;
    stroke: var(--mist-dim);
  }

  /* ══ PROFILO ══ */
  .card-profile {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 4px;
  }

  .avatar-wrap {
    position: relative;
    width: 106px;
    height: 106px;
    margin-bottom: 16px;
  }

  .avatar-ring {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(145deg, var(--brass), rgba(216, 178, 106, 0.25));
    box-shadow: 0 0 24px var(--brass-glow), 0 8px 20px -6px rgba(0, 0, 0, 0.75);
  }

  .avatar-img, .avatar-mono {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: #111722;
    display: block;
  }

  .avatar-mono {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 38px;
    font-weight: 800;
    color: var(--brass);
  }

  .verified-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    background: #080C12;
    border: 1.5px solid var(--brass);
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brass);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  .card-name {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #FFF;
    margin-bottom: 5px;
  }

  .card-role-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--brass);
    background: rgba(216, 178, 106, 0.12);
    border: 1px solid rgba(216, 178, 106, 0.26);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  .card-tagline {
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--mist-dim);
    max-width: 360px;
    margin-bottom: 14px;
  }

  /* ══ QUICK ACTION BAR ══ */
  .quick-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    width: 100%;
  }

  .quick-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--inner-line);
    color: var(--mist);
    text-decoration: none;
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .quick-btn svg {
    width: 20px;
    height: 20px;
    stroke: var(--mist);
    transition: stroke 0.2s;
  }

  .quick-btn:hover {
    border-color: var(--brass);
    background: rgba(216, 178, 106, 0.12);
    transform: translateY(-2px);
  }

  .quick-btn:hover svg {
    stroke: var(--brass);
  }

  .quick-btn:active {
    transform: scale(0.95);
  }

  /* ══ HERO ACTION: SALVA IN RUBRICA ══ */
  .vcard-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(216, 178, 106, 0.2) 0%, rgba(216, 178, 106, 0.06) 100%);
    border: 1px solid var(--brass-border);
    box-shadow: 0 8px 24px -6px rgba(216, 178, 106, 0.22);
    cursor: pointer;
    text-align: left;
    width: 100%;
    color: var(--mist);
    transition: all 0.2s ease;
  }

  .vcard-btn:hover {
    background: linear-gradient(135deg, rgba(216, 178, 106, 0.28) 0%, rgba(216, 178, 106, 0.1) 100%);
    border-color: var(--brass);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px -6px rgba(216, 178, 106, 0.34);
  }

  .vcard-btn:active {
    transform: scale(0.99);
  }

  .vcard-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(145deg, #EBC981, #C79E52);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #080B10;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(216, 178, 106, 0.35);
  }

  .vcard-icon svg {
    width: 22px;
    height: 22px;
  }

  .vcard-info {
    flex-grow: 1;
    min-width: 0;
  }

  .vcard-title {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #FFF;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .vcard-badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--brass);
    background: rgba(216, 178, 106, 0.18);
    padding: 2px 7px;
    border-radius: 999px;
    text-transform: uppercase;
  }

  .vcard-desc {
    font-size: 12.5px;
    color: var(--mist-dim);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ══ STACK LINKTREE DENTRO LA CARD ══ */
  .links-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--inner-line);
    text-decoration: none;
    color: var(--mist);
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .link-row:hover {
    border-color: rgba(216, 178, 106, 0.4);
    background: rgba(216, 178, 106, 0.07);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px -4px rgba(0, 0, 0, 0.4);
  }

  .link-row:active {
    transform: scale(0.99);
  }

  .link-icon-box {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: rgba(76, 106, 138, 0.14);
    border: 1px solid rgba(237, 242, 247, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }

  .link-row:hover .link-icon-box {
    background: rgba(216, 178, 106, 0.18);
    border-color: rgba(216, 178, 106, 0.3);
  }

  .link-icon-box svg {
    width: 19px;
    height: 19px;
    stroke: var(--brass);
  }

  .link-body {
    flex-grow: 1;
    min-width: 0;
  }

  .link-title-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .link-title {
    font-size: 15px;
    font-weight: 600;
    color: #FFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-pill {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--mist-dim);
    flex-shrink: 0;
  }

  .link-desc {
    font-size: 12px;
    color: var(--mist-dim);
    margin-top: 2px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-arrow {
    color: var(--mist-dim);
    flex-shrink: 0;
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .link-row:hover .link-arrow {
    transform: translateX(3px);
    color: var(--brass);
  }

  /* ══ SEZIONE BIO ESPANDIBILE ══ */
  .bio-details {
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--inner-line);
    overflow: hidden;
    transition: border-color 0.2s ease;
  }

  .bio-details[open] {
    border-color: rgba(216, 178, 106, 0.3);
  }

  .bio-summary {
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 15px;
    cursor: pointer;
    user-select: none;
  }

  .bio-summary::-webkit-details-marker {
    display: none;
  }

  .bio-summary-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--mist);
  }

  .bio-summary-label svg {
    width: 18px;
    height: 18px;
    stroke: var(--brass);
  }

  .bio-chevron {
    transition: transform 0.25s ease;
    color: var(--mist-dim);
  }

  .bio-details[open] .bio-chevron {
    transform: rotate(180deg);
    color: var(--brass);
  }

  .bio-content {
    padding: 0 15px 16px;
    border-top: 1px solid var(--inner-line);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--mist-dim);
  }

  .bio-content p {
    margin-top: 12px;
  }

  .skills-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }

  .skill-chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--inner-line);
    color: var(--mist);
  }

  /* ══ FOOTER DELLA CARD ══ */
  .card-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding-top: 8px;
    border-top: 1px solid var(--inner-line);
    margin-top: 2px;
  }

  .share-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    background: transparent;
    border: 1px solid rgba(216, 178, 106, 0.28);
    color: var(--mist);
    font-family: "Instrument Sans", sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .share-btn svg {
    width: 16px;
    height: 16px;
    stroke: var(--brass);
  }

  .share-btn:hover {
    background: rgba(216, 178, 106, 0.09);
    border-color: var(--brass);
  }

  .share-btn:active {
    transform: scale(0.98);
  }

  .card-footer-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--mist-dim);
    letter-spacing: 0.06em;
  }

  /* Toast notification */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #182230;
    border: 1px solid var(--brass);
    color: #FFF;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    box-shadow: 0 10px 28px rgba(0,0,0,0.8);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 99;
    white-space: nowrap;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>

<body>

<!-- ══ LA TESSERA / SMART CARD VIRTUALE ══ -->
<main class="smart-card">

  <!-- Top Bar: Badge NFC & Brand Tessera -->
  <div class="card-top-bar">
    <div class="card-brand">
      <span class="chip-dot"></span>
      <span>MO.D.A.V.I. SMART PASS</span>
    </div>
    <div class="card-nfc" title="Card Contactless">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <path d="M6 8a6 6 0 0 1 0 8"/>
        <path d="M10 5a10 10 0 0 1 0 14"/>
        <path d="M14 2a14 14 0 0 1 0 20"/>
      </svg>
    </div>
  </div>

  <!-- Profilo -->
  <header class="card-profile">
    <div class="avatar-wrap">
      <div class="avatar-ring">
        <img src="foto.jpg" alt="Francesco Piemonte" class="avatar-img" id="photo">
        <div class="avatar-mono" id="monogram" style="display:none;">FP</div>
      </div>
      <div class="verified-badge" title="Profilo Verificato">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
      </div>
    </div>

    <h1 class="card-name" id="nome">Francesco Piemonte</h1>
    <div class="card-role-pill">
      <span id="ruolo">Presidente Nazionale</span>
      <span>·</span>
      <span id="azienda" style="color:#FFF">MO.D.A.V.I.</span>
    </div>
    <p class="card-tagline" id="tagline">
      Politiche giovanili, terzo settore e fondi europei · Salerno / Roma
    </p>

    <!-- Quick action buttons (Tel, WhatsApp, Mail, LinkedIn) -->
    <div class="quick-bar" id="quickBar"></div>
  </header>

  <!-- Hero CTA: Salva in Rubrica -->
  <button class="vcard-btn" id="saveContact" type="button" aria-label="Salva contatto in rubrica">
    <div class="vcard-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
    </div>
    <div class="vcard-info">
      <div class="vcard-title">
        Salva in Rubrica
        <span class="vcard-badge">vCard</span>
      </div>
      <div class="vcard-desc">Tocca per salvare il contatto su iPhone o Android</div>
    </div>
    <div class="link-arrow">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>
  </button>

  <!-- Stack Linktree -->
  <section class="links-stack" id="linksList" aria-label="Link ufficiali e progetti"></section>

  <!-- Sezione Bio & Competenze Espandibile -->
  <details class="bio-details" id="bioDetails">
    <summary class="bio-summary">
      <div class="bio-summary-label">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Biografia & Competenze</span>
      </div>
      <div class="bio-chevron">

/* ═══════════════════════════════════════════════════════════════
   ② LOGICA & RENDERING
   ═══════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);

const ICONS = {
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  whatsapp: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-13h4v1.5A6 6 0 0 1 16 8z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
  network: '<path d="M12 2v6"/><path d="M5 22v-4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"/><path d="M12 16v6"/><circle cx="12" cy="5" r="3"/>',
  sparkle: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  book: '<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M8 7h8"/><path d="M8 11h5"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'

const getSvg = (name, strokeWidth = 1.9) => 
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.globe}</svg>`;

/* Render Dati Header */

/* Fallback Avatar */
$('#photo').addEventListener('error', () => {
  $('#photo').style.display = 'none';
  $('#monogram').style.display = 'flex';
  $('#monogram').textContent = CONFIG.iniziali;
});

/* Quick Actions Bar */
const quicks = [];
if (CONFIG.tel) {
  quicks.push({
    name: 'Telefono',
    icon: 'phone',
    href: `tel:${CONFIG.tel.replace(/[^\d+]/g, '')}`,

  });
}
if (CONFIG.whatsapp) {
  quicks.push({

  });
}
if (CONFIG.email) {
  quicks.push({
    name: 'Email',

  });
}
const linkedinLink = CONFIG.links.find(l => l.icon === 'linkedin');
if (linkedinLink) {
  quicks.push({
    name: 'LinkedIn',
    icon: 'linkedin',
    href: linkedinLink.url,
    label: 'Profilo LinkedIn',
    blank: true
  });
}

$('#quickBar').innerHTML = quicks.map(q => `
  <a class="quick-btn" href="${q.href}" aria-label="${q.label}" ${q.blank ? 'target="_blank" rel="noopener"' : ''}>
    ${getSvg(q.icon)}
  </a>
`).join('');

/* Render Linktree Stack */
$('#linksList').innerHTML = CONFIG.links.map(link => `
  <a class="link-row" href="${link.url}" target="_blank" rel="noopener">
    <div class="link-icon-box">
      ${getSvg(link.icon)}
    </div>
    <div class="link-body">
      <div class="link-title-row">
        <span class="link-title">${link.title}</span>
        ${link.badge ? `<span class="link-pill">${link.badge}</span>` : ''}

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>
  </a>
`).join('');

/* Render Bio & Competenze */
$('#bioText').innerHTML = CONFIG.bio.map(p => `<p>${p}</p>`).join('');
$('#skillsTags').innerHTML = CONFIG.competenze.map(s => `<span class="skill-chip">${s}</span>`).join('');

/* vCard 3.0 Generation */
function esc(v) {
  return String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}

function buildVCard() {
  const parts = CONFIG.nome.trim().split(/\s+/);
  const last  = parts.length > 1 ? parts.pop() : '';
  const first = parts.join(' ');
  const citta = CONFIG.citta.split(' · ')[0];

  return [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:' + esc(last) + ';' + esc(first) + ';;;',
    'FN:' + esc(CONFIG.nome),
    'ORG:' + esc(CONFIG.azienda),
    'TITLE:' + esc(CONFIG.ruolo),
    'ROLE:' + esc(CONFIG.ruolo),
    'TEL;TYPE=WORK,VOICE:' + esc(CONFIG.tel),
    ...(CONFIG.whatsapp ? ['TEL;TYPE=CELL,VOICE:+' + esc(CONFIG.whatsapp)] : []),
    'EMAIL;TYPE=INTERNET,WORK:' + esc(CONFIG.email),
    ...CONFIG.links.map(l => (l.icon === 'linkedin' ? 'X-SOCIALPROFILE;TYPE=linkedin:' : 'URL:') + esc(l.url)),
    'ADR;TYPE=WORK:;;;' + esc(citta) + ';;;Italia',
    'NOTE:' + esc(CONFIG.tagline + ' · ' + CONFIG.competenze.join(', ')),
    'REV:' + new Date().toISOString().replace(/\.\d+/, ''),
    'END:VCARD'
  ].join('\r\n') + '\r\n';
}

$('#saveContact').addEventListener('click', () => {
  const vcf  = buildVCard();
  const file = CONFIG.nome.replace(/\s+/g, '_') + '.vcf';
  const a    = document.createElement('a');

  if ('download' in a) {
    const url = URL.createObjectURL(new Blob([vcf], { type: 'text/vcard;charset=utf-8' }));
    a.href = url;
    a.download = file;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } else {
    window.open('data:text/vcard;charset=utf-8,' + encodeURIComponent(vcf));
  }

  showToast('vCard scaricata! Aprila per salvare il contatto.');
});

/* Toast Notification Helper */
function showToast(text) {
  const toast = $('#toast');
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

/* Condivisione Profilo */
$('#shareBtn').addEventListener('click', async () => {
  const shareData = {
    title: `${CONFIG.nome} — ${CONFIG.azienda}`,
    text: `${CONFIG.nome}, ${CONFIG.ruolo} (${CONFIG.azienda})`,
    url: window.location.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
      return;
    }
    await navigator.clipboard.writeText(window.location.href);
    showToast('Link copiato negli appunti!');
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    showToast('Copia il link dalla barra degli indirizzi');
  }
});
