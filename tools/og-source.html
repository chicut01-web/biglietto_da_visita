<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#07090C;color:#E8EDF3;overflow:hidden;
       font-family:"Instrument Sans",system-ui,sans-serif;position:relative}
  .glow{position:absolute;inset:-30% -10% auto -25%;height:120%;
        background:radial-gradient(46% 52% at 34% 42%, rgba(216,178,106,.17), transparent 68%)}
  .grid{position:absolute;inset:0;
        background-image:linear-gradient(rgba(76,106,138,.09) 1px,transparent 1px),
                         linear-gradient(90deg,rgba(76,106,138,.09) 1px,transparent 1px);
        background-size:48px 48px;
        -webkit-mask-image:radial-gradient(75% 80% at 30% 50%,#000,transparent 78%)}
  .frame{position:absolute;inset:34px;border:1px solid rgba(232,237,243,.10);border-radius:22px}
  .content{position:relative;height:100%;display:flex;align-items:center;gap:64px;padding:0 104px}
  .avatar{position:relative;flex:none;width:212px;height:212px;border-radius:50%;
          background:linear-gradient(160deg,#1b232e,#0c1116);display:grid;place-items:center;
          box-shadow:0 0 0 1px rgba(216,178,106,.55),0 0 0 12px rgba(216,178,106,.06)}
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .badge{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;
         font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
         color:#D8B26A;background:#0b1017;border:1px solid rgba(216,178,106,.34);padding:7px 15px;border-radius:999px}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.24em;
           text-transform:uppercase;color:#8D9AAB;margin-bottom:22px}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:76px;line-height:.92;
     letter-spacing:-.04em;font-variation-settings:"wdth" 88}
  .role{font-size:25px;color:#8D9AAB;margin-top:20px;letter-spacing:-.01em}
  .tags{display:flex;gap:10px;margin-top:32px}
  .tags span{font-family:"IBM Plex Mono",monospace;font-size:14px;color:#8D9AAB;
             border:1px solid rgba(232,237,243,.12);background:rgba(148,163,184,.07);
             padding:9px 15px;border-radius:999px}
  .rule{position:absolute;left:104px;right:104px;bottom:96px;height:1px;background:rgba(232,237,243,.09)}
  .foot{position:absolute;left:104px;bottom:58px;font-family:"IBM Plex Mono",monospace;
        font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#4C6A8A}
  .foot em{color:#D8B26A;font-style:normal}
</style></head>
<body>
  <div class="glow"></div><div class="grid"></div><div class="frame"></div>
  <div class="content">
    <div class="avatar"><img src="../foto.jpg" alt=""><span class="badge">MO.D.A.V.I. APS-RA</span></div>
    <div>
      <p class="eyebrow">Scheda contatto</p>
      <h1>Francesco<br>Piemonte</h1>
      <p class="role">Presidente Nazionale · Politiche giovanili ed europee</p>
      <div class="tags"><span>Politiche giovanili</span><span>Terzo settore</span><span>Fondi europei</span></div>
    </div>
  </div>
  <div class="rule"></div>
  <p class="foot">Tocca per salvare in rubrica <em>→</em></p>
</body></html>
