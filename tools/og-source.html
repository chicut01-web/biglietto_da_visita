<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600;12..96,75..100,700;12..96,75..100,800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #06080B;
    color: #E8EDF3;
    overflow: hidden;
    font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
    position: relative;
  }

  /* Glow e atmosfera oro/acciaio calda e vibrante */
  .glow {
    position: absolute;
    inset: -30% -10% auto -25%;
    height: 130%;
    background: radial-gradient(48% 54% at 30% 45%, rgba(216, 178, 106, 0.22), transparent 72%);
    pointer-events: none;
  }

  /* Griglia di precisione */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(76, 106, 138, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76, 106, 138, 0.08) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(75% 80% at 30% 50%, #000 35%, transparent 84%);
    pointer-events: none;
  }

  /* Cornice perimetrale sottile ed elegante */
  .frame {
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(232, 237, 243, 0.12);
    border-radius: 22px;
    pointer-events: none;
  }

  /* Layout principale a 2 colonne - RIEMPIE TUTTO IL RIQUADRO */
  .content {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 52px;
    padding: 0 68px 38px 68px;
    z-index: 2;
  }

  /* Avatar circolare MOLTO PIÙ GRANDE (375px) */
  .avatar-wrap {
    position: relative;
    flex: none;
    width: 375px;
    height: 375px;
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(160deg, #1b232e, #0c1116);
    overflow: hidden;
    box-shadow:
      0 0 0 2px rgba(216, 178, 106, 0.75),
      0 0 0 14px rgba(26, 32, 42, 0.90),
      0 0 0 16px rgba(216, 178, 106, 0.28),
      0 28px 56px rgba(0, 0, 0, 0.90);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 18%;
    display: block;
  }

  /* Badge MO.D.A.V.I. sotto il cerchio */
  .badge {
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #D8B26A;
    background: #080B10;
    border: 1px solid rgba(216, 178, 106, 0.48);
    padding: 8px 24px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
  }

  /* Colonna testi a destra */
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #8A98A8;
    margin-bottom: 16px;
  }

  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 84px;
    line-height: 0.92;
    letter-spacing: -0.04em;
    color: #FFFFFF;
    margin-bottom: 16px;
    font-variation-settings: "wdth" 88;
  }

  .role {
    font-size: 25px;
    font-weight: 500;
    color: #8A98A8;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .tags span {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    color: #CBD5E1;
    border: 1px solid rgba(232, 237, 243, 0.14);
    background: rgba(148, 163, 184, 0.08);
    padding: 9px 18px;
    border-radius: 999px;
  }

  /* Linea e footer in basso */
  .rule {
    position: absolute;
    left: 68px;
    right: 68px;
    bottom: 66px;
    height: 1px;
    background: rgba(232, 237, 243, 0.09);
    z-index: 2;
  }

  .foot {
    position: absolute;
    left: 68px;
    bottom: 34px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #556980;
    z-index: 2;
  }

  .foot em {
    color: #D8B26A;
    font-style: normal;
    font-weight: 700;
  }
</style></head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="avatar-wrap">
      <div class="avatar">
        <img src="../piemonte11-2-2.jpg" alt="Francesco Piemonte">
      </div>
      <span class="badge">MO.D.A.V.I. APS-RA</span>
    </div>

    <div class="text-side">
      <p class="eyebrow">Scheda contatto</p>
      <h1>Francesco<br>Piemonte</h1>
      <p class="role">Presidente Nazionale · Politiche giovanili ed europee</p>
      <div class="tags">
        <span>Politiche giovanili</span>
        <span>Terzo settore</span>
        <span>Fondi europei</span>
      </div>
    </div>
  </div>

  <div class="rule"></div>
  <p class="foot">Tocca per salvare in rubrica <em>→</em></p>
</body></html>
