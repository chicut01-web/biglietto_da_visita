<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,700;12..96,75..100,800&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #06080B;
    color: #FFFFFF;
    overflow: hidden;
    font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
    position: relative;
  }

  /* La foto di Francesco prende il 90% dell'intera larghezza e tutta l'altezza */
  .photo-container {
    position: absolute;
    top: 0;
    right: 0;
    width: 940px;
    height: 630px;
    z-index: 1;
  }

  .photo-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    display: block;
  }

  /* Sfumatura leggera a sinistra per fondere con eleganza */
  .vignette {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, #06080B 0%, rgba(6, 8, 11, 0.96) 8%, rgba(6, 8, 11, 0.3) 35%, transparent 65%),
      linear-gradient(180deg, rgba(6, 8, 11, 0.25) 0%, transparent 40%, rgba(6, 8, 11, 0.85) 100%);
  }

  /* Glow caldo oro */
  .ambient-glow {
    position: absolute;
    top: -25%;
    left: -15%;
    width: 750px;
    height: 750px;
    background: radial-gradient(circle, rgba(216, 178, 106, 0.20) 0%, rgba(76, 106, 138, 0.08) 50%, transparent 70%);
    pointer-events: none;
    z-index: 2;
  }

  /* Cornice ultra-luxury perimetrale */
  .gold-frame {
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(216, 178, 106, 0.35);
    border-radius: 20px;
    pointer-events: none;
    z-index: 4;
  }

  /* Informazioni compatte ed eleganti in basso a sinistra */
  .overlay-info {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 46px 54px;
    width: 440px;
  }

  .badge-official {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(10, 14, 21, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(216, 178, 106, 0.45);
    color: #D8B26A;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .badge-official::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 10px #10B981;
  }

  .title-block {
    background: rgba(6, 8, 11, 0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 24px 28px;
    border-radius: 18px;
    border: 1px solid rgba(216, 178, 106, 0.30);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
  }

  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 46px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: #FFFFFF;
    margin-bottom: 8px;
  }

  .role-line {
    font-size: 19px;
    font-weight: 600;
    color: #D8B26A;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }

  .org-line {
    font-size: 15px;
    font-weight: 500;
    color: #CBD5E1;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="photo-container">
    <img src="../piemonte11-2-2.jpg" alt="Francesco Piemonte">
    <div class="vignette"></div>
  </div>

  <div class="ambient-glow"></div>
  <div class="gold-frame"></div>

  <div class="overlay-info">
    <div class="badge-official">Biglietto Digitale</div>

    <div class="title-block">
      <h1>Francesco Piemonte</h1>
      <p class="role-line">Presidente Nazionale</p>
      <p class="org-line">MO.D.A.V.I. APS-RA</p>
    </div>
  </div>
</body>
</html>
