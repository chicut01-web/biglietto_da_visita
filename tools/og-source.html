<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600;12..96,75..100,700;12..96,75..100,800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #06080B;
    color: #E8EDF3;
    overflow: hidden;
    font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
    position: relative;
  }

  /* Foto a tutto schermo a destra con sfumatura morbida verso sinistra */
  .photo-bg {
    position: absolute;
    top: 0;
    right: 0;
    width: 620px;
    height: 630px;
    z-index: 1;
  }
  .photo-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 12%;
    display: block;
  }
  .photo-gradient {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, #06080B 0%, rgba(6, 8, 11, 0.92) 15%, rgba(6, 8, 11, 0.4) 45%, transparent 75%),
      linear-gradient(180deg, rgba(6, 8, 11, 0.3) 0%, transparent 40%, rgba(6, 8, 11, 0.85) 100%);
  }

  /* Glow e atmosfera */
  .glow {
    position: absolute;
    top: 10%;
    left: -10%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(216, 178, 106, 0.18) 0%, rgba(76, 106, 138, 0.08) 50%, transparent 70%);
    pointer-events: none;
    z-index: 2;
  }

  /* Griglia sottile a sinistra */
  .grid {
    position: absolute;
    inset: 0;
    width: 600px;
    background-image:
      linear-gradient(rgba(216, 178, 106, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(216, 178, 106, 0.04) 1px, transparent 1px);
    background-size: 38px 38px;
    z-index: 2;
  }

  /* Cornice ultra-luxury */
  .frame {
    position: absolute;
    inset: 22px;
    border: 1px solid rgba(216, 178, 106, 0.28);
    border-radius: 20px;
    pointer-events: none;
    z-index: 4;
  }

  /* Contenuto a sinistra */
  .content {
    position: relative;
    z-index: 3;
    width: 640px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 0 0 68px;
  }

  .badge-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(216, 178, 106, 0.12);
    border: 1px solid rgba(216, 178, 106, 0.38);
    color: #D8B26A;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .badge-tag::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #D8B26A;
    box-shadow: 0 0 8px #D8B26A;
  }

  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 74px;
    line-height: 0.94;
    letter-spacing: -0.04em;
    color: #FFFFFF;
    margin-bottom: 18px;
  }

  .role {
    font-size: 26px;
    font-weight: 600;
    color: #D8B26A;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }

  .org {
    font-size: 20px;
    font-weight: 500;
    color: #94A3B8;
    margin-bottom: 30px;
  }

  .pills {
    display: flex;
    gap: 10px;
    margin-bottom: 36px;
  }
  .pill {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: #CBD5E1;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 8px 15px;
    border-radius: 999px;
  }

  .cta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #94A3B8;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .cta span {
    color: #D8B26A;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="photo-bg">
    <img src="../piemonte11-2-2.jpg" alt="Francesco Piemonte">
    <div class="photo-gradient"></div>
  </div>

  <div class="glow"></div>
  <div class="grid"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="badge-tag">Scheda Contatto Ufficiale</div>
    <h1>Francesco<br>Piemonte</h1>
    <p class="role">Presidente Nazionale</p>
    <p class="org">MO.D.A.V.I. APS-RA · Salerno / Roma</p>

    <div class="pills">
      <span class="pill">Politiche giovanili</span>
      <span class="pill">Terzo settore</span>
      <span class="pill">Fondi europei</span>
    </div>

    <div class="cta">
      Tocca per salvare contatto <span>→</span>
    </div>
  </div>
</body>
</html>
